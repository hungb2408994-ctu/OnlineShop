<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Quản lý người dùng</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <h2>Online Shop</h2>
        <a href="/" class="back-home-btn"> ← Về trang chủ </a>
        <nav>
          <a href="/admin/products">Quản lý sản phẩm</a>
          <a href="/admin/categories">Quản lý danh mục</a>
          <a href="/admin/orders">Quản lý đơn hàng</a>
          <a href="/admin/users" class="active">Quản lý người dùng</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1>Quản lý người dùng</h1>

          <div class="topbar-actions">
            <div class="notification-wrapper">
              <button
                type="button"
                id="notificationBell"
                class="notification-bell"
                title="Thông báo"
              >
                🔔
                <span id="notificationBadge" class="notification-badge" hidden
                  >0</span
                >
              </button>

              <div id="notificationPanel" class="notification-panel" hidden>
                <div class="notification-header">
                  <h3>Thông báo</h3>

                  <button type="button" id="markAllReadBtn">
                    Đánh dấu tất cả đã đọc
                  </button>
                </div>

                <div id="notificationList"></div>
              </div>
            </div>

            <span class="admin-label">Admin</span>
          </div>
        </header>

        <section class="content">
          <!-- Thống kê -->
          <div class="user-statistics">
            <div class="user-stat-card">
              <span>Tổng người dùng</span>
              <strong id="totalUsers">0</strong>
            </div>

            <div class="user-stat-card">
              <span>Đang hoạt động</span>
              <strong id="activeUsers">0</strong>
            </div>

            <div class="user-stat-card">
              <span>Đã khóa</span>
              <strong id="blockedUsers">0</strong>
            </div>

            <div class="user-stat-card">
              <span>Quản trị viên</span>
              <strong id="adminUsers">0</strong>
            </div>
          </div>

          <!-- Tìm kiếm -->
          <div class="toolbar user-toolbar">
            <input
              type="text"
              id="searchUserInput"
              placeholder="Tìm kiếm theo họ tên hoặc email..."
            />

            <button id="searchUserBtn">Tìm kiếm</button>
            <button id="resetUserBtn" class="reset-user-btn">Làm mới</button>
          </div>

          <p id="userMessage" class="user-message"></p>

          <!-- Bảng người dùng -->
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Họ tên</th>
                  <th>Email</th>
                  <th>Số điện thoại</th>
                  <th>Vai trò</th>
                  <th>Trạng thái</th>
                  <th>Thao tác</th>
                </tr>
              </thead>

              <tbody id="userTableBody">
                <tr>
                  <td colspan="7">Đang tải dữ liệu...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- Modal chi tiết người dùng -->
    <div id="userDetailModal" class="modal hidden">
      <div class="modal-content user-modal-content">
        <div class="modal-header">
          <h3>Chi tiết người dùng</h3>
          <button type="button" id="closeUserDetailBtn">×</button>
        </div>

        <div id="userDetailContent" class="user-detail-content"></div>

        <div class="modal-actions">
          <button type="button" id="closeUserDetailBtn2">Đóng</button>
        </div>
      </div>
    </div>

    <script th:src="@{/js/admin-users.js}"></script>
    <script th:src="@{/js/admin-notification.js}"></script>
  </body>
</html>
