<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Quản lý sản phẩm</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>

  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <h2>Online Shop</h2>
        <a href="/" class="back-home-btn"> ← Về trang chủ </a>
        <nav>
          <a href="/admin/products" class="active">Quản lý sản phẩm</a>
          <a href="/admin/categories">Quản lý danh mục</a>
          <a href="/admin/orders">Quản lý đơn hàng</a>
          <a href="/admin/users">Quản lý người dùng</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1>Quản lý sản phẩm</h1>

          <div class="topbar-actions">
            <div class="notification-wrapper">
              <button
                type="button"
                id="notificationBell"
                class="notification-bell"
                title="Thông báo"
              >
                🔔
                <span id="notificationBadge" class="notification-badge" hidden
                  >0</span
                >
              </button>

              <div id="notificationPanel" class="notification-panel" hidden>
                <div class="notification-header">
                  <h3>Thông báo</h3>
                  <button type="button" id="markAllReadBtn">
                    Đánh dấu tất cả đã đọc
                  </button>
                </div>

                <div id="notificationList"></div>
              </div>
            </div>

            <span class="admin-label">Admin</span>
          </div>
        </header>

        <section class="content">
          <div class="toolbar">
            <input
              type="text"
              id="searchInput"
              placeholder="Tìm kiếm sản phẩm..."
            />

            <button id="addProductBtn">+ Thêm sản phẩm</button>
          </div>

          <div class="filter">
            <input type="number" id="minPrice" placeholder="Giá thấp nhất" />

            <input type="number" id="maxPrice" placeholder="Giá cao nhất" />

            <button id="filterBtn">Lọc</button>
            <button id="resetBtn">Làm mới</button>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên sản phẩm</th>
                  <th>Giá</th>
                  <th>Số lượng</th>
                  <th>Danh mục</th>
                  <th>Thao tác</th>
                </tr>
              </thead>

              <tbody id="productTableBody">
                <!-- JavaScript sẽ hiển thị dữ liệu tại đây -->
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <!-- Modal thêm / sửa sản phẩm -->
      <div id="productModal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="modalTitle">Thêm sản phẩm</h2>
            <button type="button" id="closeModalBtn">&times;</button>
          </div>

          <form id="productForm">
            <div class="form-group">
              <label for="productName">Tên sản phẩm</label>
              <input type="text" id="productName" required />
            </div>

            <div class="form-group">
              <label for="productDescription">Mô tả</label>
              <textarea id="productDescription" rows="3"></textarea>
            </div>

            <div class="form-group">
              <label for="productPrice">Giá sản phẩm</label>
              <input
                type="number"
                id="productPrice"
                min="0"
                step="0.01"
                required
              />
            </div>

            <div class="form-group">
              <label for="productQuantity">Số lượng</label>
              <input
                type="number"
                id="productQuantity"
                min="0"
                step="1"
                required
              />
            </div>

            <div class="form-group">
              <label for="productImageUrl">Đường dẫn hình ảnh</label>
              <input type="text" id="productImageUrl" />
            </div>

            <div class="form-group">
              <label for="productCategoryId">Danh mục</label>
              <select id="productCategoryId" required>
                <option value="">-- Chọn danh mục --</option>
              </select>
            </div>

            <div class="modal-actions">
              <button type="button" id="cancelModalBtn">Hủy</button>

              <button type="submit" id="saveProductBtn">Lưu sản phẩm</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script th:src="@{/js/admin.js}"></script>
    <script th:src="@{/js/admin-notification.js}"></script>
  </body>
</html>
