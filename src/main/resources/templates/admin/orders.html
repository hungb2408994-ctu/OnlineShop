
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="admin-container">

    <aside class="sidebar">
        <h2>ADMIN</h2>
        <nav>
            <a href="/admin/products">Quản lý sản phẩm</a>
            <a href="/admin/categories">Quản lý danh mục</a>
            <a href="/admin/orders" class="active">Quản lý đơn hàng</a>
            <a href="#">Quản lý người dùng</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h1>Quản lý đơn hàng</h1>

            <div class="topbar-actions">
                <div class="notification-wrapper">
                    <button type="button"
                            id="notificationBell"
                            class="notification-bell"
                            title="Thông báo">
                        🔔
                        <span id="notificationBadge"
                            class="notification-badge"
                            hidden>0</span>
                    </button>

                    <div id="notificationPanel"
                        class="notification-panel"
                        hidden>
                        <div class="notification-header">
                            <h3>Thông báo</h3>
                            <button type="button" id="markAllReadBtn">
                                Đánh dấu tất cả đã đọc
                            </button>
                        </div>
                        <div id="notificationList"></div>
                    </div>
                </div>

                <span class="admin-label">Admin</span>
            </div>
        </header>

        <section class="content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Mã đơn hàng</th>
                            <th>Khách hàng</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6">Đang xây dựng chức năng quản lý đơn hàng...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</div>
    <script th:src="@{/js/admin-notification.js}"></script>
</body>
</html>
