
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${productModel != null ? productModel.name : product.name} + ' | Online Shop'">
        Chi tiết sản phẩm
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8ff;
            color: #172554;
        }

        .container {
            max-width: 1150px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #dbeafe;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.06);
        }

        .product-image {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            background: #f8fafc;
            border-radius: 14px;
            padding: 20px;
        }

        .product-image img {
            max-width: 100%;
            max-height: 380px;
            object-fit: contain;
        }

        .product-info {
            padding: 20px 0;
        }

        .product-label {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .product-info h1 {
            margin: 15px 0;
            font-size: 30px;
            line-height: 1.4;
        }

        .price {
            margin: 25px 0;
            color: #2563eb;
            font-size: 27px;
            font-weight: 700;
        }

        .description {
            color: #64748b;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .stock {
            display: inline-block;
            padding: 10px 15px;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .variant-section {
            margin-top: 25px;
        }

        .variant-title {
            display: block;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .variant-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .variant-option {
            min-width: 90px;
            padding: 12px 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .variant-option:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .variant-option.active {
            border: 2px solid #2563eb;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .variant-option:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .cart-section {
            margin-top: 28px;
            padding-top: 25px;
            border-top: 1px solid #e2e8f0;
        }

        .quantity-label {
            display: block;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            width: fit-content;
            height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            overflow: hidden;
        }

        .quantity-control button {
            width: 44px;
            height: 100%;
            border: none;
            background: #f1f5f9;
            color: #1e293b;
            font-size: 21px;
            cursor: pointer;
        }

        .quantity-control button:hover:not(:disabled) {
            background: #dbeafe;
        }

        .quantity-control button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .quantity-control input {
            width: 55px;
            height: 100%;
            border: none;
            outline: none;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #172554;
        }

        .quantity-hint {
            margin-top: 9px;
            color: #64748b;
            font-size: 13px;
        }

        .cart-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .add-cart-button,
        .view-cart-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 22px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-cart-button {
            border: none;
            background: #2563eb;
            color: white;
        }

        .add-cart-button:hover:not(:disabled) {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .add-cart-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .view-cart-button {
            border: 1px solid #2563eb;
            color: #2563eb;
            background: white;
        }

        .view-cart-button:hover {
            background: #eff6ff;
        }

        .cart-message {
            display: none;
            margin-top: 18px;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .cart-message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .cart-message.error {
            display: block;
            color: #b91c1c;
            background: #fee2e2;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px auto;
            }

            .product-detail {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 20px;
            }

            .product-image {
                min-height: 260px;
            }

            .product-info h1 {
                font-size: 24px;
            }

            .cart-actions {
                flex-direction: column;
            }

            .add-cart-button,
            .view-cart-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <a href="/products" class="back-link">
        ← Quay lại danh sách sản phẩm
    </a>

    <div class="product-detail"
         id="productDetail"
         th:attr="data-product-id=${product.id},
                  data-stock=${product.quantity},
                  data-price=${product.price}">

        <div class="product-image">
            <img id="productImage"
                 th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                 th:src="${product.imageUrl}"
                 th:alt="${product.name}">

            <img id="productImageFallback"
                 th:unless="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                 src="https://placehold.co/500x400?text=No+Image"
                 alt="No image">
        </div>

        <div class="product-info">

            <span class="product-label">Chi tiết sản phẩm</span>

            <h1 id="productName"
                th:text="${productModel != null ? productModel.name : product.name}">
                Tên sản phẩm
            </h1>

            <div class="variant-section"
                 th:if="${productModel != null and #lists.size(variants) > 0}">

                <span class="variant-title">Chọn phiên bản:</span>

                <div class="variant-options">
                    <button type="button"
                            class="variant-option"
                            th:each="variant : ${variants}"
                            th:classappend="${variant.id == product.id} ? ' active' : ''"
                            th:attr="data-product-id=${variant.id},
                                     data-price=${variant.price},
                                     data-stock=${variant.quantity},
                                     data-name=${variant.name},
                                     data-image-url=${variant.imageUrl},
                                     data-variant-name=${variant.variantName != null ? variant.variantName : variant.name}">

                        <span th:text="${variant.variantName != null ? variant.variantName : variant.name}">
                            Phiên bản
                        </span>
                    </button>
                </div>
            </div>

            <p class="price">
                <span id="productPrice"
                      th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}">
                </span>
                VND
            </p>

            <p class="description"
               th:text="${productModel != null and productModel.description != null and !productModel.description.isEmpty()
                    ? productModel.description
                    : (product.description != null and !product.description.isEmpty()
                        ? product.description : 'Sản phẩm hiện chưa có mô tả.')}">
                Mô tả sản phẩm
            </p>

            <div class="stock">
                Còn hàng:
                <strong id="productStock" th:text="${product.quantity}">0</strong>
            </div>

            <div class="cart-section">

                <label class="quantity-label" for="quantityInput">
                    Số lượng
                </label>

                <div class="quantity-control">
                    <button type="button" id="decreaseButton">−</button>

                    <input type="number"
                           id="quantityInput"
                           value="1"
                           min="1"
                           th:attr="max=${product.quantity}"
                           readonly>

                    <button type="button" id="increaseButton">+</button>
                </div>

                <p class="quantity-hint">
                    Bạn có thể chọn tối đa
                    <strong id="maxStock" th:text="${product.quantity}">0</strong>
                    sản phẩm.
                </p>

                <div class="cart-actions">
                    <button type="button"
                            class="add-cart-button"
                            id="addToCartButton"
                            th:disabled="${product.quantity == null or product.quantity <= 0}">
                        🛒 Thêm vào giỏ hàng
                    </button>

                    <a href="/cart" class="view-cart-button">
                        Xem giỏ hàng
                    </a>
                </div>

                <div id="cartMessage" class="cart-message"></div>

            </div>
        </div>
    </div>
</div>

<script src="/js/session.js"></script>
<script src="/js/product-detail.js"></script>
</body>
</html>
