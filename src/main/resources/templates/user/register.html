<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Online Shop</title>
    <link rel="stylesheet" th:href="@{/css/user/auth.css}">
</head>
<body>

<div class="auth-container">
    <a href="/" class="auth-logo">ONLINE SHOP</a>

    <div class="auth-card">
        <h1>Tạo tài khoản</h1>
        <p class="auth-subtitle">Đăng ký để bắt đầu mua sắm</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Họ và tên</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Nhập họ và tên"
                    autocomplete="name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Nhập số điện thoại"
                    autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Tạo mật khẩu"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                        aria-label="Hiển thị mật khẩu"
                        aria-pressed="false">

                        <svg class="eye-icon" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="authMessage" class="auth-message" role="alert"></div>

            <button type="submit" class="auth-button">
                Đăng ký
            </button>
        </form>

        <p class="auth-switch">
            Đã có tài khoản?
            <a th:href="@{/login}" id="loginLink">Đăng nhập</a>
        </p>

        <a href="/" class="back-home">← Quay lại trang chủ</a>
    </div>
</div>

<script th:src="@{/js/session.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
